<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="POST">
    {% csrf_token %}
    <div align="center">
        <h1>User Login</h1>
        <h3><font color="#00ced1">{{ form.message  }}</font></h3>
        <table>
            <tr>
                <th>Login ID:</th>
                <td><input type="text" name="loginId" value="{{ form.login_id }}"></td>
                <td style="position: fixed;"><font color="#ffd700">{{ form.input_error.login_id }}</font></td>
            </tr>
            <tr>
                <th>Password:</th>
                <td><input type="password" name="password" value="{{ form.password }}"></td>
                <td style="position: fixed;"><font color="#ffd700">{{ form.input_error.password }}</font></td>

            </tr>
            <tr>
                <th></th>
                <td><input type="submit" value="signIn"></td>
            </tr>
        </table>
    </div>
</form>
</body>
</html>
